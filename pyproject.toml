[project]
name = "monitor"
version = "0.1.0"
description = "Monitor - 专业级 Windows 硬件与 AI 性能监控中枢"
readme = "README.md"
authors = [
    { name = "ck554", email = "ck554@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = [
    "hardware-monitor",
    "gpu",
    "nvidia",
    "rtss",
    "afterburner",
    "fps",
    "antigravity",
    "pyqt6",
    "windows"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Monitoring",
]
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.2.2",
    "pynvml>=13.0.1",
    "pyqt6>=6.11.0",
]

[project.scripts]
monitor = "src.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
